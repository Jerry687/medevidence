[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[project]
name = "medevidence"
version = "0.0.0"
description = "Traceable drug-safety evidence research system"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
    "alembic==1.18.5",
    "defusedxml==0.7.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.51",
]

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.0",
    "ruff==0.15.22",
]

[tool.uv]
required-version = "==0.11.32"
python-preference = "only-managed"
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "live_api: explicit opt-in tests that contact external APIs",
]

[tool.coverage.run]
branch = true
source = ["medevidence"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
