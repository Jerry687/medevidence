# ME-000A must approve exact build-backend and dependency versions before this
# repository becomes installable. This M0 file contains Python 3.12 tool
# policy only. Do not add project metadata, dependencies, or a build backend
# before ME-000A.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live_api: explicit opt-in tests that contact external APIs",
]

[tool.coverage.run]
branch = true
source = ["medevidence"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
