name: dependency-audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/assert-pwsh-runtime.ps1"
      - "scripts/dependency-audit.ps1"
      - "scripts/setup-pwsh-ci.sh"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/assert-pwsh-runtime.ps1"
      - "scripts/dependency-audit.ps1"
      - "scripts/setup-pwsh-ci.sh"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check out non-pull-request commit
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install approved PowerShell runtime
        shell: bash
        run: bash ./scripts/setup-pwsh-ci.sh
      - name: Install approved uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12.13"
          enable-cache: false
      - name: Synchronize the complete locked environment
        shell: pwsh
        run: |
          ./scripts/assert-pwsh-runtime.ps1 -Quiet
          uv sync --locked --all-groups
      - name: Audit the pull-request dependency graph
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          MEDEV_EVIDENCE_BRANCH: ${{ github.head_ref }}
          MEDEV_EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/assert-pwsh-runtime.ps1 -Quiet
          pwsh -NoLogo -NoProfile `
            -File .\scripts\dependency-audit.ps1 `
            -Mode Audit `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "medevidence-dependency-audit") `
            -LogicalBranch $env:MEDEV_EVIDENCE_BRANCH `
            -ExpectedCommit $env:MEDEV_EVIDENCE_COMMIT
      - name: Audit the non-pull-request dependency graph
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          MEDEV_EVIDENCE_BRANCH: ${{ github.ref_name }}
          MEDEV_EVIDENCE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/assert-pwsh-runtime.ps1 -Quiet
          pwsh -NoLogo -NoProfile `
            -File .\scripts\dependency-audit.ps1 `
            -Mode Audit `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "medevidence-dependency-audit") `
            -LogicalBranch $env:MEDEV_EVIDENCE_BRANCH `
            -ExpectedCommit $env:MEDEV_EVIDENCE_COMMIT
