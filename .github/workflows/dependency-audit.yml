name: dependency-audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/dependency-audit.ps1"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/dependency-audit.ps1"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install approved uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12.13"
          enable-cache: false
      - name: Synchronize the complete locked environment
        shell: powershell
        run: uv sync --locked --all-groups
      - name: Audit the complete locked dependency graph
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\dependency-audit.ps1 `
            -Mode Audit `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "medevidence-dependency-audit")
